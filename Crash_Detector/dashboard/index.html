<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrashDetector Dashboard</title>
<style>
:root{--bg:#16181c;--panel:#20242a;--ink:#eceff3;--mute:#8d96a3;--ok:#3ddc97;--bad:#ff4d5e;--amber:#ffb300}
*{box-sizing:border-box}
body{margin:0 auto;padding:20px;max-width:760px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
h1{font-size:1.5rem;margin:0 0 4px}
.meta{color:var(--mute);font-size:.9rem;margin-bottom:16px}
.state{padding:28px 16px;border-radius:10px;text-align:center;font-weight:800;font-size:1.6rem;background:#16342a;color:var(--ok)}
.state.bad{background:var(--bad);color:#fff}
button{margin:10px 0;padding:10px 16px;border:0;border-radius:6px;background:#3a414b;color:var(--ink);font:inherit}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-top:1px solid #3a414b}
th{color:var(--mute);font-weight:600}
a{color:var(--amber)}
.wrap{overflow-x:auto}
</style></head><body>
<h1>CrashDetector</h1>
<div class="meta" id="meta">Memuat…</div>
<div class="state" id="state">Aman, menunggu data</div>
<button id="reset">Reset status</button>
<div class="wrap"><table>
 <thead><tr><th>Waktu</th><th>Kecepatan (km/jam)</th><th>g</th><th>°/s</th><th>Lokasi</th></tr></thead>
 <tbody id="rows"></tbody></table></div>
<script>
const $ = id => document.getElementById(id);
const cell = (tr, node) => { const td = document.createElement('td'); td.append(node); tr.append(td); };
async function tick() {
  try {
    const s = await (await fetch('/api/state')).json();
    $('meta').textContent = `Broker ${s.broker} · ${s.connected ? 'terhubung' : 'terputus'} · topic ${s.topic}`;
    $('state').className = 'state' + (s.alarm ? ' bad' : '');
    $('state').textContent = s.alarm ? 'KECELAKAAN TERDETEKSI' : 'Aman, menunggu data';
    const rows = $('rows'); rows.replaceChildren();
    for (const e of s.events) {
      const tr = document.createElement('tr');
      cell(tr, (e.ts || '') + (e.simulated ? ' (simulasi)' : ''));
      cell(tr, `${e.speedBefore} → ${e.speedAfter}`);
      cell(tr, String(e.gPeak)); cell(tr, String(e.rotationPeak));
      if (e.lat != null && e.lon != null) {
        const a = document.createElement('a');
        a.href = `https://www.google.com/maps?q=${e.lat},${e.lon}`; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = `${e.lat}, ${e.lon}`; cell(tr, a);
      } else cell(tr, 'tidak tersedia');
      rows.append(tr);
    }
  } catch { $('meta').textContent = 'detector.py tidak merespons'; }
}
$('reset').onclick = async () => { await fetch('/api/reset', {method: 'POST'}); tick(); };
tick(); setInterval(tick, 1000);
</script></body></html>
