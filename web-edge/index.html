<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrashDetector IoT</title>
<style>
:root{--bg:#16181c;--panel:#20242a;--ink:#eceff3;--mute:#8d96a3;--ok:#3ddc97;--bad:#ff4d5e;--amber:#ffb300}
*{box-sizing:border-box}
body{margin:0 auto;padding:16px;max-width:560px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
h1{font-size:1.4rem;margin:.2rem 0 1rem}
section{background:var(--panel);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;margin-bottom:10px;color:var(--mute);font-size:.9rem}
input,select{display:block;width:100%;margin-top:4px;padding:10px;border-radius:6px;border:1px solid #3a414b;background:var(--bg);color:var(--ink);font:inherit}
button{padding:12px 16px;border:0;border-radius:6px;background:var(--amber);color:#1a1300;font:inherit;font-weight:700;width:100%;margin-top:6px}
button.alt{background:#3a414b;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid b{display:block;font-size:2.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
small,#net,#gps,#live{color:var(--mute);font-size:.85rem}
.state{padding:22px 14px;border-radius:8px;text-align:center;font-weight:800;font-size:1.3rem;background:#16342a;color:var(--ok)}
.state.bad{background:var(--bad);color:#fff}
.ev{border-top:1px solid #3a414b;padding:10px 0}
a{color:var(--amber)}
details{margin:10px 0}
</style></head><body>
<h1>CrashDetector</h1>

<section id="setup">
 <label>Peran
  <select id="role"><option value="1">Edge 1: sensor kendaraan</option><option value="2">Edge 2: penerima peringatan</option></select></label>
 <label>PROJECT_ID (sama di semua perangkat)<input id="pid" value="crash_kelompok_11"></label>
 <label>Broker HiveMQ Cloud (WebSocket aman)<input id="url" value="wss://CLUSTER-ID.s1.eu.hivemq.cloud:8884/mqtt"></label>
 <label>Username broker<input id="usr" autocomplete="off"></label>
 <label>Password broker<input id="pwd" type="password" autocomplete="off"></label>
 <button id="go">Mulai</button>
</section>

<section id="e1" hidden>
 <div class="grid">
  <div><b id="spd">0</b><small>km/jam (GPS)</small></div>
  <div><b id="g">0.0</b><small>g (accelerometer)</small></div>
  <div><b id="rot">0</b><small>°/s (gyroscope)</small></div>
 </div>
 <p id="gps">GPS: menunggu sinyal…</p>
 <details><summary>Ambang batas deteksi</summary>
  <label>Kecepatan sebelum crash ≥ (km/jam)<input id="t_spd" type="number" value="30"></label>
  <label>Dianggap berhenti ≤ (km/jam)<input id="t_stop" type="number" value="5"></label>
  <label>Benturan ≥ (g)<input id="t_g" type="number" step="0.5" value="3"></label>
  <label>Rotasi ≥ (°/s)<input id="t_rot" type="number" value="250"></label>
 </details>
 <button id="sim" class="alt">Simulasi kecelakaan</button>
</section>

<section id="e2" hidden>
 <div id="state" class="state">Aman, menunggu data</div>
 <p id="live">Lokasi ED1: menunggu data…</p>
 <button id="reset" class="alt">Reset status</button>
 <div id="log"></div>
</section>
<p id="net">Broker: belum terhubung</p>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const S = {hist: [], speed: 0, pos: null, prev: null, lastCrash: 0, lastImp: 0, lastRot: 0, gv: 0, rv: 0};
const cfg = () => ({spd: +$('t_spd').value, stop: +$('t_stop').value, g: +$('t_g').value, rot: +$('t_rot').value});
let client, topic, topicLoc, ac;

$('go').onclick = async () => {
  const role = $('role').value;
  topic = `crashdetector/${$('pid').value.trim()}/crash`;
  topicLoc = `crashdetector/${$('pid').value.trim()}/location`;
  if (role === '1' && typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    if (await DeviceMotionEvent.requestPermission() !== 'granted') return alert('Izin sensor gerak ditolak');
  }
  if ($('url').value.includes('CLUSTER-ID')) return alert('Isi alamat cluster HiveMQ Cloud kamu');
  if (role === '2') ac = new (window.AudioContext || window.webkitAudioContext)();
  client = mqtt.connect($('url').value, {clientId: `cd_${role}_${Math.random().toString(16).slice(2, 8)}`, reconnectPeriod: 2000,
    username: $('usr').value || undefined, password: $('pwd').value || undefined});
  client.on('connect', () => { $('net').textContent = 'Broker: terhubung · ' + topic; if (role === '2') client.subscribe({[topic]: {qos: 1}, [topicLoc]: {qos: 0}}); });
  client.on('close', () => $('net').textContent = 'Broker: terputus, mencoba lagi…');
  $('setup').hidden = true;
  role === '1' ? startE1() : startE2();
};

/* ---------- ED1: deteksi (GPS + accelerometer + gyroscope) ---------- */
function dist(a, b) { // haversine, meter
  const R = 6371000, r = x => x * Math.PI / 180;
  const h = Math.sin(r(b.latitude - a.latitude) / 2) ** 2 + Math.cos(r(a.latitude)) * Math.cos(r(b.latitude)) * Math.sin(r(b.longitude - a.longitude) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// Algoritma GPS ED1 -> ED2 (sama dengan shared/location.py): jeda minimal, kirim bila bergeser, heartbeat saat diam
const LOC = {interval: 5000, minMove: 10, heartbeat: 30000, maxAcc: 100};
let locSent = null, locSeq = 0;
function shareLoc(c, kph) {
  const now = Date.now();
  if (c.accuracy != null && c.accuracy > LOC.maxAcc) return;
  if (locSent) {
    const el = now - locSent.t;
    if (el < LOC.interval) return;
    if (el < LOC.heartbeat && dist(locSent, c) < LOC.minMove) return;
  }
  locSent = {latitude: c.latitude, longitude: c.longitude, t: now};
  if (!client || !client.connected) return;
  client.publish(topicLoc, JSON.stringify({deviceId: 'ED1', ts: new Date().toISOString(), seq: ++locSeq,
    location: {lat: c.latitude, lon: c.longitude, accuracy: c.accuracy}, speedKph: +kph.toFixed(1)}), {qos: 0});
}

function startE1() {
  $('e1').hidden = false;
  navigator.geolocation.watchPosition(p => {
    const c = p.coords, t = p.timestamp;
    let v = c.speed; // m/s; null di sebagian perangkat -> hitung dari jarak antar fix
    if (v == null && S.prev) v = dist(S.prev, c) / Math.max((t - S.prev.t) / 1000, 0.5);
    S.prev = {latitude: c.latitude, longitude: c.longitude, t};
    S.pos = {lat: c.latitude, lon: c.longitude, accuracy: c.accuracy};
    S.speed = (v || 0) * 3.6;
    S.hist.push({t: Date.now(), v: S.speed});
    $('spd').textContent = S.speed.toFixed(0);
    $('gps').textContent = `GPS ${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)} (±${c.accuracy.toFixed(0)} m)`;
    shareLoc(c, S.speed);
    check();
  }, e => $('gps').textContent = 'GPS error: ' + e.message, {enableHighAccuracy: true, maximumAge: 0});

  addEventListener('devicemotion', e => {
    const a = e.accelerationIncludingGravity, r = e.rotationRate, now = Date.now(), c = cfg();
    if (a) {
      const g = Math.hypot(a.x || 0, a.y || 0, a.z || 0) / 9.81;
      $('g').textContent = g.toFixed(1);
      if (g >= c.g) { S.lastImp = now; S.gv = Math.max(S.gv, g); }
    }
    if (r) {
      const w = Math.hypot(r.alpha || 0, r.beta || 0, r.gamma || 0);
      $('rot').textContent = w.toFixed(0);
      if (w >= c.rot) { S.lastRot = now; S.rv = Math.max(S.rv, w); }
    }
    check();
  });
  $('sim').onclick = () => fire({before: 30, after: 0, simulated: true});
}

// Crash = kecepatan turun mendadak (mis. 30 -> 0 km/jam dalam 5 dtk) DAN ada benturan/rotasi keras
function check() {
  const now = Date.now(), c = cfg();
  if (now - S.lastCrash < 30000) return; // cooldown 30 dtk
  S.hist = S.hist.filter(h => now - h.t <= 5000);
  const before = Math.max(0, ...S.hist.map(h => h.v));
  const stopped = before >= c.spd && S.speed <= c.stop;
  const impact = now - S.lastImp < 4000, spin = now - S.lastRot < 4000;
  if (stopped && (impact || spin)) fire({});
}

function fire(x) {
  S.lastCrash = Date.now();
  const before = Math.max(0, ...S.hist.map(h => h.v));
  const p = {isCrash: true, deviceId: 'ED1', ts: new Date().toISOString(), location: S.pos,
    speedBefore: x.before ?? +before.toFixed(1), speedAfter: x.after ?? +S.speed.toFixed(1),
    gPeak: +S.gv.toFixed(2), rotationPeak: +S.rv.toFixed(0), simulated: !!x.simulated};
  client.publish(topic, JSON.stringify(p), {qos: 1});
  $('gps').textContent = 'Crash terkirim ke broker (' + new Date().toLocaleTimeString('id-ID') + ')';
  S.gv = S.rv = 0;
}

/* ---------- ED2: penerima ---------- */
const okLoc = l => l && Number.isFinite(l.lat) && Number.isFinite(l.lon) && Math.abs(l.lat) <= 90 && Math.abs(l.lon) <= 180;
let lastLoc = null, lastLocAt = 0;
function startE2() {
  $('e2').hidden = false;
  $('reset').onclick = () => { $('state').className = 'state'; $('state').textContent = 'Aman, menunggu data'; };
  client.on('message', (t, m) => {
    let d; try { d = JSON.parse(m.toString()); } catch { return; }
    if (t === topicLoc) { // lokasi live ED1
      if (!okLoc(d.location)) return;
      lastLoc = d.location; lastLocAt = Date.now();
      $('live').textContent = `Lokasi ED1: ${lastLoc.lat.toFixed(5)}, ${lastLoc.lon.toFixed(5)} · ${new Date().toLocaleTimeString('id-ID')}`;
      return;
    }
    if (d.isCrash !== true) return;
    let l = d.location, note = '';
    if (!okLoc(l) && lastLoc) { l = lastLoc; note = ` (lokasi terakhir, ${Math.round((Date.now() - lastLocAt) / 1000)} dtk lalu)`; }
    const n = v => Number(v) || 0; // data dari broker publik = tidak tepercaya, jangan masuk innerHTML mentah
    const ev = document.createElement('div'); ev.className = 'ev';
    const line1 = document.createElement('b');
    line1.textContent = new Date(d.ts).toLocaleTimeString('id-ID') + (d.simulated ? ' (simulasi)' : '');
    ev.append(line1, document.createElement('br'),
      `Kecepatan ${n(d.speedBefore)} → ${n(d.speedAfter)} km/jam · ${n(d.gPeak)} g · ${n(d.rotationPeak)} °/s`,
      document.createElement('br'));
    if (okLoc(l)) {
      const a = document.createElement('a');
      a.href = `https://www.google.com/maps?q=${n(l.lat)},${n(l.lon)}`; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = `${n(l.lat).toFixed(5)}, ${n(l.lon).toFixed(5)}: buka peta`;
      ev.append(a, note);
    } else ev.append('Lokasi tidak tersedia');
    $('log').prepend(ev);
    $('state').className = 'state bad'; $('state').textContent = 'KECELAKAAN TERDETEKSI';
    if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
    const o = ac.createOscillator(); o.frequency.value = 880; o.connect(ac.destination); o.start(); o.stop(ac.currentTime + 1.2);
  });
}
</script></body></html>
